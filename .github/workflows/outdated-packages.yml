name: outdated-packages

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm outdated compares against the installed tree, so node_modules
      # must exist — otherwise every package is reported as MISSING.
      - run: npm ci

      # npm outdated exits 1 when updates are available -> job goes red.
      - name: Check for outdated packages
        shell: bash
        run: |
          set +e
          output=$(npm outdated 2>&1)
          status=$?
          set -e

          echo "$output"

          if [ "$status" -eq 0 ]; then
            echo "### ✅ All packages are up to date" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⚠️ Outdated packages"
              echo ""
              echo '```'
              echo "$output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Package updates are available — see job summary"
            exit 1
          fi
